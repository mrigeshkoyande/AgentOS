<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentOS — AI Organization Operating System</title>
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .grid-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridFade 8s ease-in-out infinite alternate;
    }
    @keyframes gridFade { from { opacity: 0.5; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="landing-bg"></div>

  <div class="landing-wrap" style="position:relative;z-index:1;">
    <div class="landing-header">
      <div class="landing-logo">⚡ AgentOS</div>
      <div class="landing-tagline">Describe your goal. Deploy an AI organization.</div>
    </div>

    <div class="card" style="padding:28px;">
      <div class="input-area">
        <textarea
          id="descriptionInput"
          class="textarea"
          style="min-height:160px;font-size:15px;padding-right:64px;"
          placeholder="Describe your goal... e.g. 'Build a SaaS landing page for a project management tool targeting remote teams'"
          maxlength="5000"
        ></textarea>
        <div class="char-counter"><span id="charCount">0</span>/5000</div>
      </div>

      <div class="example-chips">
        <div class="chip" data-example="Build a complete marketing strategy and brand identity for a new eco-friendly water bottle startup targeting Gen Z consumers">🌿 Eco-startup marketing</div>
        <div class="chip" data-example="Design and plan a mobile app for tracking personal finances with AI-powered spending insights and investment recommendations">💰 Finance app MVP</div>
        <div class="chip" data-example="Create a comprehensive technical architecture and implementation plan for a real-time collaborative code editor like VS Code Live Share">🛠️ Collab code editor</div>
      </div>

      <button class="btn-primary btn-generate" id="generateBtn" onclick="generate()">
        Generate Organization →
      </button>
    </div>

    <div class="past-sessions-toggle" style="margin-top:32px;">
      <button class="btn-ghost" onclick="toggleSessions()">⏱ Past Sessions</button>
    </div>

    <div id="pastSessionsPanel" class="past-sessions-panel card" style="display:none;padding:0;margin-top:12px;">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
        <span style="font-weight:600;font-size:14px;">Recent Sessions</span>
        <button class="btn-ghost" style="padding:4px 10px;font-size:12px;" onclick="loadSessions()">↻ Refresh</button>
      </div>
      <div id="sessionsList">
        <div style="padding:20px;text-align:center;color:var(--text3);font-size:13px;">Loading…</div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const textarea = document.getElementById('descriptionInput');
    const charCount = document.getElementById('charCount');
    const generateBtn = document.getElementById('generateBtn');

    textarea.addEventListener('input', () => {
      charCount.textContent = textarea.value.length;
    });

    textarea.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generate();
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        textarea.value = chip.dataset.example;
        charCount.textContent = textarea.value.length;
        textarea.focus();
      });
    });

    async function generate() {
      const desc = textarea.value.trim();
      if (desc.length < 10) {
        alert('Please describe your goal (at least 10 characters).');
        return;
      }
      generateBtn.disabled = true;
      generateBtn.textContent = '⚙️ Analyzing your goal…';

      const { data, error } = await AgentAPI.createSession(desc);
      if (error || !data) {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate Organization →';
        return;
      }
      window.location.href = `session.html?id=${data.session_id}`;
    }

    let sessionsLoaded = false;
    function toggleSessions() {
      const panel = document.getElementById('pastSessionsPanel');
      const shown = panel.style.display !== 'none';
      panel.style.display = shown ? 'none' : 'block';
      if (!shown && !sessionsLoaded) loadSessions();
    }

    async function loadSessions() {
      sessionsLoaded = true;
      const list = document.getElementById('sessionsList');
      list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3);">Loading…</div>';
      const { data } = await AgentAPI.listSessions();
      if (!data || !data.length) {
        list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px;">No sessions yet.</div>';
        return;
      }
      list.innerHTML = data.map(s => `
        <div class="session-list-item" onclick="window.location.href='session.html?id=${s.session_id}'">
          <div>
            <div class="session-list-title">${s.title || 'Untitled'}</div>
            <div class="session-list-meta">${s.completed_agents}/${s.total_agents} agents · ${s.created_at ? new Date(s.created_at).toLocaleString() : ''}</div>
          </div>
          <span class="badge badge-${statusColor(s.status)}">${s.status}</span>
        </div>
      `).join('');
    }

    function statusColor(s) {
      return s === 'completed' ? 'cyan' : s === 'running' ? 'yellow' : s === 'error' ? 'red' : 'purple';
    }
  </script>
</body>
</html>
