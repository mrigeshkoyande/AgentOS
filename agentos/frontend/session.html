<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentOS — Session</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-logo">⚡ AgentOS</div>
    <div class="topbar-title" id="sessionTitle">Loading…</div>
    <span class="badge badge-yellow" id="statusBadge">draft</span>
    <div class="topbar-progress" id="progressText">0/0 agents</div>
    <div class="topbar-timer" id="elapsedTimer">0:00</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <button class="btn-ghost" id="pauseBtn" onclick="pauseSession()" style="display:none;">⏸ Pause</button>
      <button class="btn-secondary" onclick="exportMd()">⬇ Export</button>
      <a href="index.html" class="btn-ghost">← Home</a>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="session-layout">
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="left-panel-section" style="flex:0 0 auto;max-height:45%;">
        <div class="panel-section-title">Organization</div>
        <div id="orgChartContainer"></div>
      </div>
      <div class="left-panel-section" style="flex:1;overflow-y:auto;">
        <div class="panel-section-title">Activity Feed</div>
        <div class="activity-feed" id="activityFeed"></div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="agents-grid" id="agentPanels"></div>
    </div>
  </div>

  <!-- Completion Bar -->
  <div class="completion-bar hidden" id="completionBar">
    <span class="completion-msg">✅ All agents complete!</span>
    <button class="btn-secondary" onclick="downloadMd()">⬇ Markdown</button>
    <button class="btn-secondary" onclick="downloadJson()">⬇ JSON</button>
    <a id="resultsLink" href="#" class="btn-primary">View Results →</a>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ws.js"></script>
  <script src="js/orgChart.js"></script>
  <script src="js/agentPanel.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const SESSION_ID = params.get('id');
    if (!SESSION_ID) { alert('No session ID'); location.href = 'index.html'; }

    document.getElementById('resultsLink').href = `results.html?id=${SESSION_ID}`;

    let orgChart, agentPanel, wsClient;
    let timerInterval, startTime;
    let totalAgents = 0, completedAgents = 0;
    let sessionStatus = 'draft';

    // ── Init ──────────────────────────────────────────────────────────────────
    (async () => {
      orgChart = new OrgChart('orgChartContainer');
      agentPanel = new AgentPanel('agentPanels');

      const { data, error } = await AgentAPI.getSession(SESSION_ID);
      if (error || !data) { addFeed('Could not load session', 'error'); return; }

      sessionStatus = data.status;
      document.title = `AgentOS — ${data.title || 'Session'}`;
      document.getElementById('sessionTitle').textContent = data.title || 'Session';
      totalAgents = data.total_agents || 0;
      completedAgents = data.completed_agents || 0;
      updateProgress();
      updateStatusBadge(data.status);

      if (data.agents && data.agents.length) {
        orgChart.render(data.agents);
        data.agents.forEach(ag => agentPanel.createPanel(ag));
      }

      connectWS();
    })();

    // ── WebSocket ─────────────────────────────────────────────────────────────
    function connectWS() {
      wsClient = new AgentWS(SESSION_ID);

      wsClient.on('_connected', () => {
        addFeed('WebSocket connected', 'system');
        if (sessionStatus === 'draft') {
          setTimeout(() => autoRun(), 1500);
        } else if (sessionStatus === 'running') {
          startTimer();
          document.getElementById('pauseBtn').style.display = '';
        } else if (sessionStatus === 'completed') {
          showCompletion();
        }
      });

      wsClient.on('_disconnected', () => addFeed('WS disconnected — reconnecting…', 'system'));
      wsClient.on('_failed', () => addFeed('WS connection failed after retries', 'error'));

      wsClient.on('agent_created', (e) => {
        addFeed(`Agent created: ${e.role}`, 'agent');
      });

      wsClient.on('agent_started', (e) => {
        addFeed(`▶ ${e.role} started`, 'agent');
        orgChart.updateAgent(e.agent_id, { status: 'running' });
        agentPanel.setRunning(e.agent_id);
        document.getElementById('pauseBtn').style.display = '';
      });

      wsClient.on('agent_token', (e) => {
        agentPanel.appendToken(e.agent_id, e.token);
      });

      wsClient.on('agent_done', (e) => {
        addFeed(`✓ ${e.role} done (~${e.tokens} tokens)`, 'done');
        orgChart.updateAgent(e.agent_id, { status: 'done' });
        agentPanel.setDone(e.agent_id, e.summary, e.tokens);
        completedAgents++;
        updateProgress();
      });

      wsClient.on('agent_error', (e) => {
        addFeed(`✗ ${e.role} error: ${e.error}`, 'error');
        orgChart.updateAgent(e.agent_id, { status: 'error' });
        agentPanel.setError(e.agent_id, e.error);
        completedAgents++;
        updateProgress();
      });

      wsClient.on('message_sent', (e) => {
        addFeed(`💬 ${e.from_role} → ${e.to_role}`, 'message');
        agentPanel.showMessage(e);
      });

      wsClient.on('layer_started', (e) => {
        addFeed(`Layer ${e.layer} started: ${e.roles.join(', ')}`, 'layer');
      });

      wsClient.on('layer_done', (e) => {
        addFeed(`Layer ${e.layer} complete`, 'done');
      });

      wsClient.on('session_done', (e) => {
        addFeed(`🎉 Session complete in ${e.elapsed}s`, 'done');
        updateStatusBadge('completed');
        sessionStatus = 'completed';
        stopTimer();
        document.getElementById('pauseBtn').style.display = 'none';
        showCompletion();
      });

      wsClient.connect();
    }

    async function autoRun() {
      addFeed('Auto-starting session…', 'system');
      sessionStatus = 'running';
      updateStatusBadge('running');
      startTimer();
      await AgentAPI.runSession(SESSION_ID);
    }

    async function pauseSession() {
      await AgentAPI.pauseSession(SESSION_ID);
      sessionStatus = 'paused';
      updateStatusBadge('paused');
      stopTimer();
      document.getElementById('pauseBtn').style.display = 'none';
      addFeed('Session paused', 'system');
    }

    // ── UI Helpers ────────────────────────────────────────────────────────────
    function updateProgress() {
      document.getElementById('progressText').textContent = `${completedAgents}/${totalAgents} agents`;
    }

    function updateStatusBadge(status) {
      const badge = document.getElementById('statusBadge');
      badge.textContent = status;
      badge.className = `badge badge-${status === 'completed' ? 'cyan' : status === 'running' ? 'yellow' : status === 'error' ? 'red' : 'purple'}`;
    }

    function startTimer() {
      startTime = startTime || Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = Math.floor(elapsed / 60);
        const s = elapsed % 60;
        document.getElementById('elapsedTimer').textContent = `${m}:${String(s).padStart(2,'0')}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function showCompletion() {
      document.getElementById('completionBar').classList.remove('hidden');
    }

    let feedCount = 0;
    function addFeed(text, type = 'system') {
      const feed = document.getElementById('activityFeed');
      if (feedCount >= 200) feed.firstChild && feed.firstChild.remove();
      const item = document.createElement('div');
      item.className = `feed-item feed-item-${type}`;
      item.textContent = `${new Date().toLocaleTimeString()} · ${text}`;
      feed.appendChild(item);
      feed.scrollTop = feed.scrollHeight;
      feedCount++;
    }

    async function exportMd() {
      const { data } = await AgentAPI.exportResults(SESSION_ID, 'markdown');
      if (data) _downloadBlob(data, `agentos_${SESSION_ID}.md`);
    }
    async function downloadMd() { exportMd(); }
    async function downloadJson() {
      const { data } = await AgentAPI.exportResults(SESSION_ID, 'json');
      if (data) _downloadBlob(data, `agentos_${SESSION_ID}.json`);
    }
    function _downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
