<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentOS — Results</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-logo">⚡ AgentOS</div>
    <div class="topbar-title" id="sessionTitle">Results</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <button class="btn-secondary" onclick="downloadMd()">⬇ Markdown</button>
      <button class="btn-secondary" onclick="downloadJson()">⬇ JSON</button>
      <a id="sessionLink" href="#" class="btn-ghost">← Session</a>
      <a href="index.html" class="btn-ghost">🏠 Home</a>
    </div>
  </div>

  <div class="results-layout">
    <!-- Main Content -->
    <div class="results-main">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab('report')">📄 Full Report</button>
        <button class="tab" onclick="switchTab('json')">{} JSON</button>
        <button class="tab" onclick="switchTab('messages')">💬 Messages</button>
      </div>

      <div id="tab-report" class="tab-panel active">
        <div class="markdown-body" id="markdownContent">
          <div style="color:var(--text3);padding:40px;text-align:center;">Loading report…</div>
        </div>
      </div>

      <div id="tab-json" class="tab-panel">
        <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
          <button class="btn-ghost" onclick="copyJson()">📋 Copy</button>
        </div>
        <pre class="json-block" id="jsonContent">Loading…</pre>
      </div>

      <div id="tab-messages" class="tab-panel">
        <div class="msg-timeline" id="msgTimeline">
          <div style="color:var(--text3);padding:20px;text-align:center;">Loading messages…</div>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="results-sidebar">
      <div style="font-weight:600;font-size:13px;margin-bottom:16px;color:var(--text2);">Session Stats</div>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-value" id="statAgents">—</div><div class="stat-label">Agents</div></div>
        <div class="stat-card"><div class="stat-value" id="statTokens">—</div><div class="stat-label">Tokens</div></div>
        <div class="stat-card"><div class="stat-value" id="statMessages">—</div><div class="stat-label">Messages</div></div>
        <div class="stat-card"><div class="stat-value" id="statLayers">—</div><div class="stat-label">Layers</div></div>
      </div>

      <div style="font-weight:600;font-size:13px;margin-bottom:12px;color:var(--text2);margin-top:20px;">Agents</div>
      <div id="miniAgentList"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const SESSION_ID = params.get('id');
    if (!SESSION_ID) { alert('No session ID'); location.href = 'index.html'; }

    document.getElementById('sessionLink').href = `session.html?id=${SESSION_ID}`;

    let jsonData = null;

    (async () => {
      const [sessionRes, resultsRes, messagesRes] = await Promise.all([
        AgentAPI.getSession(SESSION_ID),
        AgentAPI.getResults(SESSION_ID),
        AgentAPI.getMessages(SESSION_ID),
      ]);

      const session = sessionRes.data;
      if (session) {
        document.title = `AgentOS — ${session.title || 'Results'}`;
        document.getElementById('sessionTitle').textContent = session.title || 'Results';

        const agents = session.agents || [];
        const tokens = agents.reduce((s, a) => s + (a.tokens_used || 0), 0);
        const layers = Math.max(...agents.map(a => a.layer || 0), 0) + 1;

        document.getElementById('statAgents').textContent = agents.length;
        document.getElementById('statTokens').textContent = tokens > 1000 ? `${(tokens/1000).toFixed(1)}k` : tokens;
        document.getElementById('statLayers').textContent = layers;

        const mini = document.getElementById('miniAgentList');
        mini.innerHTML = agents.map(ag => `
          <div class="mini-agent">
            <span class="mini-agent-emoji">${ag.emoji || '🤖'}</span>
            <div style="min-width:0;">
              <div class="mini-agent-name">${ag.display_name || ag.role}</div>
              <div style="font-size:10px;color:var(--text3);">L${ag.layer} · ${ag.tokens_used || 0} tokens</div>
            </div>
            <span class="status-dot status-${ag.status}" style="flex-shrink:0;margin-left:auto;"></span>
          </div>
        `).join('');
      }

      const results = resultsRes.data?.results || [];
      const mdResult = results.find(r => r.format === 'markdown');
      const jsonResult = results.find(r => r.format === 'json');

      if (mdResult) {
        document.getElementById('markdownContent').innerHTML = markdownToHtml(mdResult.content);
      } else {
        document.getElementById('markdownContent').innerHTML = '<p style="color:var(--text3);">No report generated yet. Complete the session first.</p>';
      }

      if (jsonResult) {
        jsonData = jsonResult.content;
        document.getElementById('jsonContent').textContent = jsonResult.content;
      }

      const messages = messagesRes.data || [];
      document.getElementById('statMessages').textContent = messages.length;
      const timeline = document.getElementById('msgTimeline');
      if (messages.length === 0) {
        timeline.innerHTML = '<div style="color:var(--text3);padding:20px;text-align:center;">No inter-agent messages in this session.</div>';
      } else {
        timeline.innerHTML = messages.map(m => `
          <div class="msg-entry">
            <div class="msg-entry-header">
              <span class="badge badge-yellow">${m.type}</span>
              <span>${m.from_agent_id || 'system'} → ${m.to_agent_id || 'broadcast'}</span>
              <span style="margin-left:auto;">${m.timestamp ? new Date(m.timestamp).toLocaleTimeString() : ''}</span>
            </div>
            <div class="msg-entry-content">${escHtml(m.content || '')}</div>
          </div>
        `).join('');
      }
    })();

    // ── Tab Switching ──────────────────────────────────────────────────────────
    function switchTab(name) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', ['report','json','messages'][i] === name);
      });
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`tab-${name}`).classList.add('active');
    }

    // ── Downloads ──────────────────────────────────────────────────────────────
    async function downloadMd() {
      const { data } = await AgentAPI.exportResults(SESSION_ID, 'markdown');
      if (data) _dl(data, `agentos_${SESSION_ID}.md`);
    }
    async function downloadJson() {
      const { data } = await AgentAPI.exportResults(SESSION_ID, 'json');
      if (data) _dl(data, `agentos_${SESSION_ID}.json`);
    }
    function _dl(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; a.click();
      URL.revokeObjectURL(url);
    }
    function copyJson() {
      if (jsonData) { navigator.clipboard.writeText(jsonData); }
    }

    // ── Markdown Renderer ──────────────────────────────────────────────────────
    function markdownToHtml(md) {
      return md
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^---$/gm, '<hr>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>(\n|$))+/g, s => `<ul>${s}</ul>`)
        .replace(/\n\n+/g, '</p><p>')
        .replace(/^(?!<[huplic])/gm, '')
        .split('\n').join('<br>');
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
